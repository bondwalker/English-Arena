<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rebeca Esquivel</title>
    <meta name="description" content="Choose between VerbMate and English Arena." />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #0f172a;
        --card-bg: #1e293b;
        --card-bg-hover: #27364d;
        --text: #f8fafc;
        --muted: #94a3b8;
        --accent: #38bdf8;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        padding: 24px;
      }

      main {
        width: 100%;
        max-width: 640px;
        text-align: center;
      }

      h1 {
        font-size: clamp(1.5rem, 4vw, 2rem);
        margin-bottom: 8px;
      }

      p.subtitle {
        color: var(--muted);
        margin-top: 0;
        margin-bottom: 40px;
      }

      .options {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
      }

      @media (max-width: 480px) {
        .options {
          grid-template-columns: 1fr;
        }
      }

      a.card {
        display: block;
        background: var(--card-bg);
        border: 1px solid #334155;
        border-radius: 16px;
        padding: 32px 20px;
        text-decoration: none;
        color: var(--text);
        transition: background 0.15s ease, transform 0.15s ease, border-color 0.15s ease;
      }

      a.card:hover,
      a.card:focus-visible {
        background: var(--card-bg-hover);
        border-color: var(--accent);
        transform: translateY(-2px);
      }

      .card .name {
        font-size: 1.25rem;
        font-weight: 600;
        margin-bottom: 6px;
      }

      .card .desc {
        font-size: 0.9rem;
        color: var(--muted);
      }

      footer {
        margin-top: 40px;
        font-size: 0.8rem;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Looking for something?</h1>
      <p class="subtitle">Choose where you'd like to go.</p>
      <div class="options">
        <a class="card" href="https://verbmate.rebecaesquivel.com">
          <div class="name">VerbMate</div>
          <div class="desc">verbmate.rebecaesquivel.com</div>
        </a>
        <a class="card" href="https://englisharena.rebecaesquivel.com">
          <div class="name">English Arena</div>
          <div class="desc">englisharena.rebecaesquivel.com</div>
        </a>
      </div>
      <footer>rebecaesquivel.com</footer>
    </main>
  </body>
</html>
