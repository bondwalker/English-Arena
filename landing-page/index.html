<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rebeca Esquivel</title>
    <meta name="description" content="Choose between VerbMate and English Arena." />
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,700;0,900;1,700;1,900&family=JetBrains+Mono:wght@400;700&family=DM+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap');

      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      :root {
        --cream: #0f1226;
        --paper: #181d3a;
        --ink: #fdf3dd;
        --ink-soft: rgba(253, 243, 221, 0.72);
        --muted: rgba(253, 243, 221, 0.45);
        --line: rgba(253, 243, 221, 0.14);
        --dot: rgba(253, 243, 221, 0.05);
        --sun: #ffce47;
        --tomato: #ff5c42;
        --cobalt: #5b8bff;
      }

      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        overflow-x: hidden;
        font-family: 'DM Sans', sans-serif;
        background: var(--cream);
        color: var(--ink);
        padding: 2rem 1.5rem;
      }

      body::before {
        content: '';
        position: absolute;
        inset: 0;
        pointer-events: none;
        background-image: radial-gradient(var(--dot) 1px, transparent 1px);
        background-size: 14px 14px;
      }

      main {
        width: 100%;
        max-width: 780px;
        text-align: center;
        position: relative;
        z-index: 1;
      }

      h1 {
        font-family: 'Fraunces', Georgia, serif;
        font-weight: 900;
        font-size: clamp(2rem, 6vw, 3.2rem);
        letter-spacing: -0.02em;
        line-height: 1.05;
        margin-bottom: 0.9rem;
      }

      h1 em {
        font-style: italic;
        color: var(--sun);
      }

      p.subtitle {
        color: var(--muted);
        font-size: 1rem;
        line-height: 1.6;
        max-width: 420px;
        margin: 0 auto 2.8rem;
      }

      .options {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1.3rem;
      }

      @media (max-width: 560px) {
        .options {
          grid-template-columns: 1fr;
        }
      }

      a.card {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 1.1rem;
        text-align: left;
        padding: 2.2rem 1.9rem;
        min-height: 220px;
        border-radius: 18px;
        border: 2.5px solid transparent;
        text-decoration: none;
        color: var(--ink);
        transition: transform 0.13s, box-shadow 0.13s;
      }

      a.card:hover, a.card:focus-visible {
        transform: translate(-3px, -3px);
        box-shadow: 6px 6px 0 rgba(0, 0, 0, 0.25);
      }

      .card-cobalt { background: rgba(91, 139, 255, 0.12); border-color: var(--cobalt); }
      .card-tomato { background: rgba(255, 92, 66, 0.12); border-color: var(--tomato); }

      .card-icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 60px;
        height: 60px;
        border-radius: 14px;
        font-size: 1.7rem;
        flex-shrink: 0;
      }

      .card-cobalt .card-icon { background: var(--cobalt); box-shadow: 4px 4px 0 rgba(91, 139, 255, 0.2); }
      .card-tomato .card-icon { background: var(--tomato); box-shadow: 4px 4px 0 rgba(255, 92, 66, 0.2); }

      .card .name {
        display: block;
        font-family: 'Fraunces', serif;
        font-size: 1.85rem;
        font-weight: 900;
        line-height: 1.05;
        margin-bottom: 0.5rem;
      }

      .card-cobalt .name .arrow { color: var(--cobalt); }
      .card-tomato .name .arrow { color: var(--tomato); }

      .card .tagline {
        display: block;
        font-family: 'DM Sans', sans-serif;
        font-size: 1.05rem;
        font-weight: 500;
        line-height: 1.4;
        color: var(--ink-soft);
      }

      footer {
        margin-top: 2.8rem;
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.6rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Where would you<br />like to go, <em>amigo?</em></h1>
      <p class="subtitle">This is the home of two English-learning apps. Pick one to continue.</p>
      <div class="options">
        <a class="card card-cobalt" href="https://verbmate.rebecaesquivel.com">
          <span class="card-icon">📝</span>
          <span>
            <span class="name">VerbMate <span class="arrow">→</span></span>
            <span class="tagline">Practise your verb tenses with different activities.</span>
          </span>
        </a>
        <a class="card card-tomato" href="https://englisharena.rebecaesquivel.com">
          <span class="card-icon">📱</span>
          <span>
            <span class="name">English Arena <span class="arrow">→</span></span>
            <span class="tagline">Practise your overall English with fun games.</span>
          </span>
        </a>
      </div>
      <footer>rebecaesquivel.com</footer>
    </main>
  </body>
</html>
